version: "3.9"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: youtuber-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-youtuber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youtuber123}
      POSTGRES_DB: ${POSTGRES_DB:-youtuber}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-youtuber} -d ${POSTGRES_DB:-youtuber}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API + Frontend (Full Stack)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtuber-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-youtuber}:${POSTGRES_PASSWORD:-youtuber123}@db:5432/${POSTGRES_DB:-youtuber}
      
      # API Keys (set these in .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      
      # JWT Settings
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 10
      
      # CloudFlare R2 Storage (optional)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-virallab-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      STORAGE_MODE: ${STORAGE_MODE:-local}
    volumes:
      - ./generated_thumbnails:/app/generated_thumbnails
      - ./user_data:/app/user_data
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Development mode - Frontend with hot reload
  frontend-dev:
    image: node:20-slim
    container_name: youtuber-frontend-dev
    working_dir: /app
    profiles:
      - dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8001

  # Backend-only for development (no frontend build)
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: youtuber-backend-dev
    profiles:
      - dev
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-youtuber}:${POSTGRES_PASSWORD:-youtuber123}@db:5432/${POSTGRES_DB:-youtuber}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
      STORAGE_MODE: ${STORAGE_MODE:-local}
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
      - ./generated_thumbnails:/app/generated_thumbnails
      - ./user_data:/app/user_data
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:

